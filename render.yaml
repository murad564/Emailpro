# One-click deploy on Render: Dashboard → New → Blueprint → select this repository.
services:
  - type: web
    name: aristokrat-mail
    runtime: docker
    plan: starter          # always-on instance: needed so scheduled campaigns and background jobs keep running
    region: frankfurt
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aristokrat-mail-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true  # random secret used to sign sessions and encrypt the Brevo API key
      - key: ADMIN_EMAIL
        sync: false          # you are asked for these on first deploy
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Nizami Hasanov
      - key: NODE_ENV
        value: production

databases:
  - name: aristokrat-mail-db
    plan: basic-256mb
    region: frankfurt
    databaseName: aristokrat_mail
    postgresMajorVersion: "16"
